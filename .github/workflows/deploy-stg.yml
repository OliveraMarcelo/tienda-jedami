name: Deploy → Staging

on:
  push:
    tags: ['v*.*.*-rc.*']

jobs:
  build-and-push:
    name: Build & Push → Docker Hub (RC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata jedami-bff
        id: meta-bff
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/jedami-bff
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,format=long

      - name: Build y push jedami-bff
        uses: docker/build-push-action@v6
        with:
          context: ./jedami-bff
          push: true
          tags: ${{ steps.meta-bff.outputs.tags }}

      - name: Docker metadata jedami-web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/jedami-web
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,format=long

      - name: Build y push jedami-web
        uses: docker/build-push-action@v6
        with:
          context: ./jedami-web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          build-args: |
            VITE_API_URL=

  deploy:
    name: Deploy → jedami.stg.local
    needs: build-and-push
    runs-on: [self-hosted, jedami-local]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.stg.yml
            jedami-web/nginx.local.conf
          sparse-checkout-cone-mode: false

      # Los .env.stg / .env quedan en la VM (no están en el repo); el resto se
      # sincroniza en cada deploy para que la VM siga siempre al tag.
      - name: Copiar compose y nginx a la VM
        run: |
          scp -o StrictHostKeyChecking=no \
            docker-compose.stg.yml jedami-web/nginx.local.conf \
            jedami@jedami.stg.local:/opt/jedami/

      - name: Calcular versión RC
        id: ver
        # Las imágenes se publican sin la "v" (metadata-action semver): v1.1.0-rc.1 → 1.1.0-rc.1
        run: |
          ref="${{ github.ref_name }}"
          echo "value=${ref#v}" >> $GITHUB_OUTPUT

      - name: Deploy en stg VM
        run: |
          ssh -o StrictHostKeyChecking=no jedami@jedami.stg.local "
            cd /opt/jedami
            APP_VERSION=${{ steps.ver.outputs.value }} \
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
            docker compose -f docker-compose.stg.yml pull jedami-bff jedami-web
            APP_VERSION=${{ steps.ver.outputs.value }} \
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
            docker compose -f docker-compose.stg.yml up -d
          "

      - name: Health check
        run: |
          sleep 15
          wget -qO- http://jedami.stg.local:3000/api/v1/health || (echo "ERROR: BFF stg no responde" && exit 1)
          wget -qO- http://jedami.stg.local/api/v1/health >/dev/null || (echo "ERROR: web stg no responde (nginx o proxy /api)" && exit 1)
          echo "Deploy stg OK — versión ${{ steps.ver.outputs.value }}"
