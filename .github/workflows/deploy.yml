name: Deploy a producción

on:
  push:
    # Los release candidates (vX.Y.Z-rc.N) van a stg (deploy-stg.yml), nunca a prod.
    tags: ['v*.*.*', '!v*-rc.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a deployar (ej: v1.0.1)'
        required: false
        default: 'latest'
      reason:
        description: 'Motivo del deploy manual'
        required: false
        default: 'deploy manual'

jobs:
  # ─── Gate: lint + build antes de deployar ────────────────────────────────
  ci:
    name: BFF — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jedami-bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: jedami-bff/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ─── Build imágenes Docker y push a Docker Hub ───────────────────────────
  build-and-push:
    name: Build & Push → Docker Hub
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata jedami-bff
        id: meta-bff
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/jedami-bff
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha,prefix=,format=long

      - name: Build y push jedami-bff
        uses: docker/build-push-action@v6
        with:
          context: ./jedami-bff
          push: true
          tags: ${{ steps.meta-bff.outputs.tags }}

      - name: Docker metadata jedami-web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/jedami-web
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha,prefix=,format=long

      - name: Build y push jedami-web
        uses: docker/build-push-action@v6
        with:
          context: ./jedami-web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          build-args: |
            VITE_API_URL=

  # ─── Deploy al Droplet vía SSH ────────────────────────────────────────────
  deploy:
    name: Deploy → DigitalOcean
    needs: [ci, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Calcular versión a deployar
        id: ver
        # Las imágenes se publican sin la "v" (metadata-action semver): v1.0.1 → 1.0.1
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ref="${{ github.ref_name }}"
          else
            ref="${{ inputs.version || 'latest' }}"
          fi
          echo "value=${ref#v}" >> $GITHUB_OUTPUT

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,APP_VERSION
          script: |
            set -e  # si falla el pull, el deploy debe fallar (no seguir con la imagen vieja)
            cd /opt/jedami
            git pull origin main
            echo "Deployando versión: $APP_VERSION"
            # Guardar versión e imagen en .env.prod: así un "up -d" manual con
            # --env-file .env.prod levanta esta versión y no una "latest" vieja
            set_env() {
              if grep -q "^$1=" .env.prod; then
                sed -i "s|^$1=.*|$1=$2|" .env.prod
              else
                printf '\n%s=%s\n' "$1" "$2" >> .env.prod
              fi
            }
            set_env APP_VERSION "$APP_VERSION"
            set_env DOCKERHUB_USERNAME "$DOCKERHUB_USERNAME"
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull jedami-bff jedami-web
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d jedami-bff jedami-web
            echo "Verificando salud del BFF..."
            sleep 15
            docker compose -f docker-compose.prod.yml exec -T jedami-bff wget -qO- http://localhost:3000/api/v1/health || (echo "ERROR: BFF no responde" && exit 1)
            echo "Deploy exitoso — versión $APP_VERSION en producción"
            docker image prune -f
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          APP_VERSION: ${{ steps.ver.outputs.value }}
