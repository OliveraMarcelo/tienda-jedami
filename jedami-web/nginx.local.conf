# ─── nginx para ambientes locales (dev / stg en VMs KVM) ─────────────────────
# Igual que nginx.conf de producción pero solo HTTP: en las VMs no hay
# certificados de Let's Encrypt. Se monta desde docker-compose.dev.yml y
# docker-compose.stg.yml encima de /etc/nginx/conf.d/jedami.conf, así la
# imagen es la misma que va a producción.
server {
    listen 80;
    server_name _;

    # ─── DNS interno de Docker ────────────────────────────────────────────────
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Archivos estáticos: caché agresiva ──────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── Proxy al backend: API ────────────────────────────────────────────────
    location /api/ {
        set $upstream http://jedami-bff:3000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ─── Proxy al backend: uploads ───────────────────────────────────────────
    location /uploads/ {
        set $upstream http://jedami-bff:3000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;

        expires 7d;
        add_header Cache-Control "public";
    }

    # ─── Vue Router (History Mode) ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Seguridad (sin HSTS: no hay HTTPS) ──────────────────────────────────
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
